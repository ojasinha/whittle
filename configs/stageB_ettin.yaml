# Stage B: SFT of Plan A on filtered pilot pairs, starting from the Stage A checkpoint.
out_dir: runs/stageB_ettin
seed: 0
model:
  type: ettin_s2s
  init: runs/stageA_pilot/best
  label_smoothing: 0.1
  max_src: 512
  max_tgt: 512
data:
  train: {kind: pairs, path: data/pairs/pilot/train.jsonl, identity_frac: 0.10}
  val: {kind: pairs, path: data/pairs/pilot/val.jsonl}
optim: {lr_pre: 1.0e-4, lr_new: 3.0e-4, weight_decay: 0.01, warmup_ratio: 0.03, schedule: cosine, grad_clip: 1.0}
train:
  epochs: 3
  max_tokens: 8192
  grad_accum: 2
  bf16: true
  grad_ckpt: true
  log_every: 25
  eval_every: 150
  save_every: 150
  early_stop_patience: 3
