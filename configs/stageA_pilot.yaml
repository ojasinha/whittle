# Stage A (Plan A only): denoising on human text so the new cross-attention learns to read the encoder.
out_dir: runs/stageA_pilot
seed: 0
model:
  type: ettin_s2s
  init: {encoder: jhu-clsp/ettin-encoder-32m, decoder: jhu-clsp/ettin-decoder-32m}
  tie_encoder_embeddings: true
  xattn_zero_init: out_proj   # zero out-proj => exact pretrained decoder at init, but learns from step 1
  xattn_gate_init: 1.0
  label_smoothing: 0.0
  max_src: 512
  max_tgt: 512
data:
  train:
    kind: denoise
    path: data/stageA/train.jsonl
    noise: {mask: 0.30, shuffle: 0.10, delete: 0.10, slop: 0.30, slop_mask: 0.10, identity: 0.10}
  val:
    kind: denoise
    path: data/stageA/val.jsonl
    noise: {mask: 0.30, shuffle: 0.10, delete: 0.10, slop: 0.30, slop_mask: 0.10, identity: 0.10}
optim: {lr_pre: 1.0e-4, lr_new: 1.0e-3, weight_decay: 0.01, warmup_ratio: 0.03, schedule: cosine, grad_clip: 1.0, min_lr_ratio: 0.1}
train:
  epochs: 2
  max_tokens: 8192
  grad_accum: 2
  bf16: true
  grad_ckpt: true
  log_every: 50
  eval_every: 500
  eval_batches: 60
  save_every: 500
  early_stop_patience: 4
