[project]
name = "whittle"
version = "0.1.0"
description = "A <100M-parameter English unslop rewriter warm-started from Ettin"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "tokenizers",
    "accelerate",
    "datasets",
    "safetensors",
    "pyyaml",
    "numpy",
    "tqdm",
    "sacrebleu>=2.6.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
eval = ["sentence-transformers", "spacy", "textstat", "datasketch"]
dev = ["pytest"]

[project.scripts]
whittle = "whittle.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whittle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
